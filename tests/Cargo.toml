[package]
name = "cabby-compat"
description = "Translated upstream AnyCable test corpus (see compat/test-map.json)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
cabby-core.workspace = true
cabby-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# One test binary per upstream Go package (unit/<package>/main.rs, one module per
# upstream *_test.go file) and one per external suite. Entries are append-only.

[[test]]
name = "protocol"
path = "unit/protocol/main.rs"

[[test]]
name = "ws"
path = "unit/ws/main.rs"

[[test]]
name = "conformance"
path = "conformance/main.rs"

[[test]]
name = "rpc"
path = "unit/rpc/main.rs"

[[test]]
name = "metrics"
path = "unit/metrics/main.rs"

[[test]]
name = "telemetry"
path = "unit/telemetry/main.rs"
