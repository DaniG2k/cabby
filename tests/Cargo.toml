[package]
name = "cabby-compat"
description = "Translated upstream AnyCable test corpus (see compat/test-map.json)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
cabby-core.workspace = true
cabby-server.workspace = true
cabby-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# One test binary per upstream Go package (unit/<package>/main.rs, one module per
# upstream *_test.go file) and one per external suite. Entries are append-only.

[[test]]
name = "protocol"
path = "unit/protocol/main.rs"

[[test]]
name = "ws"
path = "unit/ws/main.rs"

[[test]]
name = "conformance"
path = "conformance/main.rs"

[[test]]
name = "identity"
path = "unit/identity/main.rs"

[[test]]
name = "streams"
path = "unit/streams/main.rs"

[[test]]
name = "broker"
path = "unit/broker/main.rs"

[[test]]
name = "api"
path = "unit/api/main.rs"

[[test]]
name = "common"
path = "unit/common/main.rs"

[[test]]
name = "encoders"
path = "unit/encoders/main.rs"

[[test]]
name = "utils"
path = "unit/utils/main.rs"

[[test]]
name = "logger"
path = "unit/logger/main.rs"

[[test]]
name = "router"
path = "unit/router/main.rs"

[[test]]
name = "server"
path = "unit/server/main.rs"

[[test]]
name = "cli"
path = "unit/cli/main.rs"

[[test]]
name = "config"
path = "unit/config/main.rs"
