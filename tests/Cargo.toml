[package]
name = "cabby-compat"
description = "Translated upstream AnyCable test corpus (see compat/test-map.json)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
base64 = "0.22.1"
cabby-bench.workspace = true
cabby-core.workspace = true
cabby-server.workspace = true
cabby-testkit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
toml.workspace = true
tungstenite.workspace = true

[lints]
workspace = true

# One test binary per upstream Go package (unit/<package>/main.rs, one module per
# upstream *_test.go file) and one per external suite. Entries are append-only.

[[test]]
name = "protocol"
path = "unit/protocol/main.rs"

