[package]
name = "cabby-compat"
description = "Translated upstream AnyCable test corpus (see compat/test-map.json)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
cabby-core.workspace = true
cabby-server.workspace = true
cabby-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# One test binary per upstream Go package (unit/<package>/main.rs, one module per
# upstream *_test.go file) and one per external suite. Entries are append-only.

[[test]]
name = "protocol"
path = "unit/protocol/main.rs"

[[test]]
name = "ws"
path = "unit/ws/main.rs"

[[test]]
name = "conformance"
path = "conformance/main.rs"

[[test]]
name = "hub"
path = "unit/hub/main.rs"

[[test]]
name = "pubsub"
path = "unit/pubsub/main.rs"

[[test]]
name = "redis"
path = "unit/redis/main.rs"

[[test]]
name = "broadcast"
path = "unit/broadcast/main.rs"

[[test]]
name = "nats"
path = "unit/nats/main.rs"

[[test]]
name = "enats"
path = "unit/enats/main.rs"
