[package]
name = "cabby-server"
description = "Cabby transports, RPC clients, adapters, configuration and executable"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cabby"
path = "src/main.rs"

[features]
default = []
# Embedded mruby scripting (upstream's `mrb` build tag), off by default and in
# release builds (D-062): builds the vendored mruby 1.2.0 on Linux and macOS.
# Without it `mrb::supported()` is false and `--metrics_log_formatter` fails.
# The test crates enable it, so `cargo build --workspace` has it through feature
# unification: build releases with `-p cabby-server`.
mruby = ["cabby-mruby-sys/vendored"]

[dependencies]
cabby-core.workspace = true
cabby-mruby-sys.workspace = true
async-nats.workspace = true
getrandom.workspace = true
hmac.workspace = true
md5.workspace = true
sha2.workspace = true
http.workspace = true
arc-swap.workspace = true
base64.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tokio-tungstenite.workspace = true
tungstenite.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
tonic.workspace = true
redis.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
