[workspace]
resolver = "3"
members = ["crates/cabby-core", "crates/cabby-server", "crates/cabby-testkit", "tests", "tools/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.0.0"
publish = false

[workspace.dependencies]
cabby-core = { path = "crates/cabby-core" }
cabby-server = { path = "crates/cabby-server" }
cabby-testkit = { path = "crates/cabby-testkit" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
# --- added for rpc/metrics/telemetry ---
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = "0.7.20"

[workspace.lints.rust]
unsafe_code = "forbid"
