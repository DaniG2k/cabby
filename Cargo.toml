[workspace]
resolver = "3"
members = ["crates/cabby-bench", "crates/cabby-core", "crates/cabby-mruby-sys", "crates/cabby-server", "crates/cabby-testkit", "tests", "tools/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.3.0"
publish = false
license = "MIT"

[workspace.dependencies]
cabby-bench = { path = "crates/cabby-bench" }
cabby-core = { path = "crates/cabby-core" }
cabby-mruby-sys = { path = "crates/cabby-mruby-sys", default-features = false }
cabby-server = { path = "crates/cabby-server" }
cabby-testkit = { path = "crates/cabby-testkit" }
anyhow = "1.0.104"
arc-swap = "1.9.3"
async-nats = { version = "=0.51.0", default-features = false, features = ["jetstream", "kv", "ring", "nuid", "server_2_10", "server_2_11"] }
base64 = "0.22.1"
bytes = "1.12.1"
# Builds the vendored mruby (cabby-mruby-sys); already in the lockfile through ring.
cc = "1.11.2"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
# System time zone for log timestamps (reads TZ / /etc/localtime; no bundled database).
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
hmac = "0.13.0"
md5 = { package = "md-5", version = "0.11.0" }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost = "0.14.6"
# Redis client (pub/sub over RESP3 pushes, streams, sentinel, cluster, rustls TLS).
redis = { version = "=1.8.1", default-features = false, features = ["aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "streams", "sentinel", "cluster-async"] }
# SQLite broker (D-065): SQLite compiled in from the bundled amalgamation (public domain), so no
# system library is needed; `cache` keeps `prepare_cached`.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
# PostgreSQL adapters (D-070, D-071): a pure-Rust client, TLS through the workspace rustls
# (ring provider; no OpenSSL).
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value", "unbounded_depth"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream ={ version = "0.1.19", features = ["net"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }
tonic-prost-build = "0.14.9"
tungstenite = "0.30.0"
tokio-tungstenite = { version = "0.30.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep test builds small on disk: line tables still give file:line backtraces
# for Cabby's code; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# PostgreSQL's SCRAM authentication derives its key with 4096 rounds of
# HMAC-SHA256 inside the connect future, on the adapters' runtime. Unoptimized,
# that takes about 30 ms per connection on a small machine, and a test process
# opening dozens of connections at once delays every other Postgres task by
# hundreds of milliseconds. Optimizing these crates in dev builds keeps a
# connect at a few milliseconds; release builds are optimized anyway.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.postgres-protocol]
opt-level = 3
