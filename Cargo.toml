[workspace]
resolver = "3"
members = ["crates/cabby-bench", "crates/cabby-core", "crates/cabby-server", "crates/cabby-testkit", "tests", "tools/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.0.0"
publish = false
license = "MIT"

[workspace.dependencies]
cabby-bench = { path = "crates/cabby-bench" }
cabby-core = { path = "crates/cabby-core" }
cabby-server = { path = "crates/cabby-server" }
cabby-testkit = { path = "crates/cabby-testkit" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tungstenite = "0.30.0"

[workspace.lints.rust]
unsafe_code = "forbid"
