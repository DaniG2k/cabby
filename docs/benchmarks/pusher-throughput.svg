<title id="t">Messages delivered per second, Pusher protocol</title><desc id="d">What each server delivered of the offered load (50k, 100k, 150k, 100k msg/s); higher is better. 50k msg/s: Soketi (Node.js) 50 thousand msg/s, Reverb (PHP) 46 thousand msg/s, AnyCable (Go) 50 thousand msg/s, Cabby (Rust) 50 thousand msg/s; 100k msg/s: Soketi (Node.js) 70 thousand msg/s, Reverb (PHP) 46 thousand msg/s, AnyCable (Go) 100 thousand msg/s, Cabby (Rust) 100 thousand msg/s; 150k msg/s: Soketi (Node.js) 70 thousand msg/s, Reverb (PHP) 45 thousand msg/s, AnyCable (Go) 150 thousand msg/s, Cabby (Rust) 150 thousand msg/s; 5,000-client room, 100k msg/s: Soketi (Node.js) 75 thousand msg/s, Reverb (PHP) 92 thousand msg/s, AnyCable (Go) 100 thousand msg/s, Cabby (Rust) 100 thousand msg/s</desc>
