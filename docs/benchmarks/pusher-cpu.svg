<title id="t">Server CPU at the same delivered rate, Pusher protocol</title><desc id="d">Average cores used while delivering the load; lower is better. 50k msg/s: Soketi (Node.js) 0.78 cores, Reverb (PHP) not sustained, AnyCable (Go) 1.22 cores, Cabby (Rust) 1.03 cores; 100k msg/s: Soketi (Node.js) not sustained, Reverb (PHP) not sustained, AnyCable (Go) 1.94 cores, Cabby (Rust) 1.66 cores; 150k msg/s: Soketi (Node.js) not sustained, Reverb (PHP) not sustained, AnyCable (Go) 3.07 cores, Cabby (Rust) 2.72 cores</desc>
