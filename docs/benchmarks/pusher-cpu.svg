<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d">
<title id="t">Server CPU at the same delivered rate, Pusher protocol</title><desc id="d">Average cores used while delivering the load; lower is better. 50k msg/s: Soketi (Node.js) 0.81 cores, Reverb (PHP) not sustained, AnyCable (Go) 1.18 cores, Cabby (Rust) 1.10 cores; 100k msg/s: Soketi (Node.js) not sustained, Reverb (PHP) not sustained, AnyCable (Go) 1.98 cores, Cabby (Rust) 1.85 cores; 150k msg/s: Soketi (Node.js) not sustained, Reverb (PHP) not sustained, AnyCable (Go) 3.08 cores, Cabby (Rust) 2.86 cores</desc>
<style>
