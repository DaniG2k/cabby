<title id="t">Highest load one core can hold</title><desc id="d">p99 at most 50 ms and no message lost, 1,000 clients; higher is better. one core, default settings: AnyCable (Go) 100 thousand msg/s, Cabby (Rust) at least 400 thousand msg/s</desc>
